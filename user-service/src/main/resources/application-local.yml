server:
  port: 8084

spring:
  datasource:
    url: jdbc:h2:mem:user_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS user_schema\;SET SCHEMA user_schema
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        default_schema: user_schema
  liquibase:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt: {}

security:
  require-email-verified: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://reactfistapp.vercel.app}

app:
  jwt:
    secret: ${APP_JWT_SECRET:aroma-local-dev-secret-key-32bytes!!}
    access-ttl-seconds: 3600
    refresh-ttl-seconds: 604800
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
