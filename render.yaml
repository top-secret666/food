# Render Blueprint — deploy Aroma APIs 24/7 (builds Docker in the cloud; no local Docker needed)
# 1) Push this repo to GitHub
# 2) Open https://dashboard.render.com/blueprints → New Blueprint Instance → select this repo
# 3) After green deploys, copy the three .onrender.com URLs into Vercel env (REACT_APP_*)

services:
  - type: web
    name: aroma-user
    runtime: docker
    plan: free
    rootDir: user-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: local
      - key: APP_JWT_SECRET
        value: aroma-render-shared-jwt-secret-key-32b
      - key: GOOGLE_CLIENT_ID
        value: 934997964943-dli89dipdsr9fbgbf6804mdghoc9rd3i.apps.googleusercontent.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://aromafood.vercel.app,https://reactfistapp.vercel.app,https://top-secret666.github.io,http://localhost:3000

  - type: web
    name: aroma-restaurant
    runtime: docker
    plan: free
    rootDir: restaurant-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: local
      - key: APP_JWT_SECRET
        value: aroma-render-shared-jwt-secret-key-32b
      - key: CORS_ALLOWED_ORIGINS
        value: https://aromafood.vercel.app,https://reactfistapp.vercel.app,https://top-secret666.github.io,http://localhost:3000

  - type: web
    name: aroma-order
    runtime: docker
    plan: free
    rootDir: order-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: local
      - key: APP_JWT_SECRET
        value: aroma-render-shared-jwt-secret-key-32b
      - key: CORS_ALLOWED_ORIGINS
        value: https://aromafood.vercel.app,https://reactfistapp.vercel.app,https://top-secret666.github.io,http://localhost:3000
      - key: USER_SERVICE_URL
        value: https://aroma-user.onrender.com
      - key: RESTAURANT_SERVICE_URL
        value: https://aroma-restaurant.onrender.com
